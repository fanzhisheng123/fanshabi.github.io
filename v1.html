<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>v1：JS基础语法练习</title>
</head>
<body>
    <h3>知识点：变量、数据类型、if判断、for循环、算术运算符</h3>
    <script>
        // 1.变量与基础数据类型
        let userName = "JS练习v1";
        const version = 1;
        let num = 92.5;
        let flag = true;
        console.log("用户名：", userName, "版本号：", version, "数值：", num, "布尔值：", flag);

        // 2.分支判断 if else
        if (num >= 60) {
            console.log("数值达标");
        } else {
            console.log("数值不达标");
        }

        // 3.for循环 打印1-10
        console.log("循环输出1~10：");
        for(let i = 1; i <= 10; i++){
            console.log(i);
        }

        // 4.简单运算
        let x = 15, y = 4;
        console.log("加法：", x + y);
        console.log("取余：", x % y);
    </script>
</body>
</html>
