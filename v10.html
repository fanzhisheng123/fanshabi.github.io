<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期末综合大作业：动漫角色信息展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f7fa;
            padding: 30px;
            font-family: "微软雅黑";
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #222;
        }
        h3 {
            color: #9131c7;
            margin: 20px 0 10px;
        }
        .tip {
            max-width: 1200px;
            margin: 0 auto 30px;
            padding: 10px 14px;
            background: #fff;
            border-left: 4px solid #9131c7;
        }
        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .role-card {
            border: 1px solid #ccc;
            padding: 18px;
            border-radius: 6px;
            background: #fff;
            box-shadow: 2px 2px 6px #dde0e6;
        }
        .role-card h3 {
            margin-bottom: 10px;
            border-bottom: 1px solid #bbb;
            padding-bottom: 6px;
            color: #9131c7;
        }
        .role-card p {
            line-height: 1.6;
            color: #444;
        }
        .search-box {
            width: 400px;
            margin: 0 auto 30px;
            display: flex;
            gap: 8px;
        }
        #search {
            flex: 1;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }
        #searchBtn {
            padding: 8px 16px;
            cursor: pointer;
            border: none;
            background: #9131c7;
            color: #fff;
            border-radius: 4px;
        }
        #searchBtn:hover {
            background: #7627a3;
        }
        .empty-tip {
            text-align: center;
            font-size: 18px;
            color: #999;
            grid-column: 1 / -1;
            padding: 40px 0;
        }
    </style>
</head>
<body>
    <h1>动漫角色信息查询系统（JS综合项目）</h1>
    <div class="tip">知识点：数组对象、DOM动态渲染、数组filter模糊搜索、键盘回车交互</div>

    <div class="search-box">
        <input type="text" id="search" placeholder="输入角色名称搜索">
        <button id="searchBtn">搜索</button>
    </div>
    <div class="wrap" id="container"></div>

    <script>
        // 1.动漫角色数据源（数组对象）
        const roleList = [
            {name:"路飞",desc:"《海贼王》主角，橡胶果实能力者，梦想成为海贼王，性格乐观热血。"},
            {name:"鸣人",desc:"《火影忍者》主角，漩涡一族后裔，体内封印九尾，立志成为火影。"},
            {name:"桐谷和人",desc:"《刀剑神域》主角，游戏高手，擅长单手剑，守护身边的伙伴。"},
            {name:"五条悟",desc:"《咒术回战》最强咒术师，拥有无下限术式，性格随性风趣。"},
            {name:"炭治郎",desc:"《鬼灭之刃》主角，温柔善良，为治愈妹妹踏上斩鬼之路。"}
        ];

        const container = document.getElementById("container");
        const searchInp = document.getElementById("search");
        const searchBtn = document.getElementById("searchBtn");

        // 2.渲染角色卡片函数
        function render(list) {
            container.innerHTML = "";
            // 无匹配数据时展示提示
            if (list.length === 0) {
                container.innerHTML = `<div class="empty-tip">未查询到匹配的角色信息</div>`;
                return;
            }
            list.forEach(item => {
                let div = document.createElement("div");
                div.className = "role-card";
                div.innerHTML = `
                    <h3>${item.name}</h3>
                    <p>${item.desc}</p>
                `;
                container.appendChild(div);
            });
        }

        // 初始渲染全部角色
        render(roleList);

        // 封装搜索逻辑
        function doSearch() {
            let key = searchInp.value.trim();
            // 输入为空，展示全部数据
            if (!key) {
                render(roleList);
                return;
            }
            // 模糊匹配筛选
            let filterArr = roleList.filter(item => item.name.includes(key));
            render(filterArr);
        }

        // 点击搜索按钮
        searchBtn.addEventListener("click", doSearch);

        // 回车快捷键搜索
        searchInp.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                doSearch();
            }
        });
    </script>
</body>
</html>
