<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 适配移动端视口（补充规范标签） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v4：DOM基础操作</title>
    <style>
        .block {
            width: 200px;
            height: 100px;
            border: 1px solid #000;
            /* 增加居中优化，视觉更好 */
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <h2 id="mainTitle">原始标题文字</h2>
    <div class="block" id="domBlock">测试容器</div>

    <h3>知识点：getElementById、innerText、style修改样式</h3>
    <script>
        // 1. 通过id获取DOM元素
        let mainTitle = document.getElementById("mainTitle");
        let domBlock = document.getElementById("domBlock");

        // 判空容错：防止id写错获取null报错
        if (mainTitle) {
            // 修改元素纯文本内容
            mainTitle.innerText = "JS动态修改后的标题";
        }
        if (domBlock) {
            // JS修改样式规则：短横线样式转驼峰命名
            domBlock.style.backgroundColor = "#eef5ff";
            domBlock.style.color = "#0066cc";
            domBlock.style.fontSize = "18px";
        }
    </script>
</body>
</html>
