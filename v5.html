<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阶段5：事件与表单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f5f5;
            padding: 30px;
            font-family: "微软雅黑";
        }
        h3 {
            color: #1a5298;
            margin: 20px 0 10px;
        }
        .box-wrap {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px #ddd;
            max-width: 500px;
        }
        input, button {
            padding: 6px 10px;
            font-size: 16px;
            margin-right: 8px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }
        button {
            background: #1a5298;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #144077;
        }
        #showText {
            font-size: 18px;
            color: #222;
            margin-top: 15px;
        }
        .tip {
            margin-top: 15px;
            padding: 10px 14px;
            background: #fff;
            border-left: 4px solid #1a5298;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div class="box-wrap">
        <input type="text" id="username" placeholder="请输入姓名">
        <button id="submitBtn">点击提交</button>
        <p id="showText"></p>
    </div>

    <h3>知识点：addEventListener、点击事件、输入框取值、表单交互</h3>
    <div class="tip">操作提示：输入文字后点击提交，空白输入会红字提示</div>

    <script>
        // 获取DOM元素
        let input = document.getElementById("username");
        let btn = document.getElementById("submitBtn");
        let show = document.getElementById("showText");

        // 判空防止获取不到元素报错
        if (btn && input && show) {
            // 绑定点击事件
            btn.addEventListener("click", function () {
                // 获取输入框的值，去除首尾空格
                let val = input.value.trim();
                // 判断是否为空
                if (val === "") {
                    show.innerText = "提示：请输入姓名！";
                    show.style.color = "red";
                } else {
                    show.innerText = "你输入的内容：" + val;
                    show.style.color = "#000";
                }
            })
            // 新增回车快捷提交，和整套项目交互统一
            input.addEventListener("keydown", function(e){
                if(e.key === "Enter"){
                    btn.click();
                }
            })
        }
    </script>
</body>
</html>
